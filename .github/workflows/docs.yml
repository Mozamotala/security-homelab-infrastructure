name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Markdown lint, links and IP check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Style-only rules are off. MD012/MD022/MD032 (blank-line spacing)
      # are off until `npx markdownlint-cli --fix "**/*.md"` is run once.
      - name: Markdown lint
        run: >
          npx --yes markdownlint-cli@0.49
          "**/*.md"
          --disable MD013 MD033 MD036 MD060 MD012 MD022 MD032

      - name: Check internal links and images
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --root-dir "${{ github.workspace }}"
            "./**/*.md"

      # Fails if a private LAN, Tailscale or CGNAT IP address appears
      # in the docs, so the home network layout is never published.
      - name: No private IP addresses in docs
        run: |
          pattern='\b(10\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])|192\.168|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7]))\.[0-9]{1,3}\.[0-9]{1,3}\b'
          if grep -rnE --include='*.md' "$pattern" .; then
            echo "::error::Private IP address found in the docs. Replace it with a placeholder such as <nas-ip>."
            exit 1
          fi
          echo "No private IP addresses found."
